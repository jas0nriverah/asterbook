name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y cppcheck prometheus
      - run: promtool check rules deploy/alerts.yml
      - run: promtool test rules tests/alerts.test.yml
      - run: cppcheck --error-exitcode=1 --enable=warning,performance,portability --std=c++20 --inline-suppr -I include src tools/itch_main.cpp
      - run: python3 -m venv "$RUNNER_TEMP/audit" && "$RUNNER_TEMP/audit/bin/pip" install pip-audit==2.9.0
      - run: '"$RUNNER_TEMP/audit/bin/pip-audit" -r requirements-dev.txt'
  dependency-review:
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.ENABLE_DEPENDENCY_REVIEW == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

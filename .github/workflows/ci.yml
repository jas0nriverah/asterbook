name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
        preset: [release, asan, tsan]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew list ninja || brew install ninja
      - name: Discover OpenSSL on macOS
        if: runner.os == 'macOS'
        run: brew list openssl@3 || brew install openssl@3
      - name: Set OpenSSL prefix on macOS
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - name: Secure demo
        if: runner.os == 'Linux' && matrix.preset == 'release'
        run: ./scripts/secure-demo.sh "$PWD/build/release/asterbook"
      - name: Expanded differential verification
        if: runner.os == 'Linux' && matrix.preset == 'release'
        run: python3 reference/differential.py --server build/release/asterbook --seeds 100 --count 1000
  fuzz:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang libssl-dev
      - run: cmake -S . -B build/fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DASTERBOOK_FUZZ=ON -DBUILD_TESTING=OFF
      - run: cmake --build build/fuzz --target parser_fuzz itch_fuzz
      - run: ./scripts/fuzz-seeds.sh build/fuzz/corpus
      - run: build/fuzz/parser_fuzz build/fuzz/corpus/parser-corpus -runs=100000 -max_len=8192
      - run: build/fuzz/itch_fuzz build/fuzz/corpus/itch-corpus -runs=100000 -max_len=512
